    {% extends 'base.html' %}

    {% block title %}
    <title>Login</title>
    {% endblock title %}

    {% block content %}
    <!-- Container for the login form -->
    <div class="container">
        <div class="login-box">
            <h2 class="user-login-heading">User Login</h2>
            <form method="POST">
                {% csrf_token %}
                <div class="input-group">
                    <input type="text" name="username" id="username" class="form-input" placeholder="Enter Username">
                </div>
                <div class="input-group">
                    <input type="password" name="password" id="password" class="form-input" placeholder="Enter Password">
                </div>
                <button type="submit" class="btn">Sign In</button>
            </form>
            {% if error %}
            <p class="error-message">{{ error }}</p>
            {% endif %}
            <div class="extra-links">
                <p><a href="/password_reset/" class="link">Forgot Password?</a></p>
                <!--<p><a href="/register/" class="link">New to the site? Register here</a></p>-->
                <p class="register-link">
                Don't have an account? <a href="/register/" class="link">Register here</a>
            </p>
            </div>
        </div>
    </div>
    <style>
        /* Container to center the forms */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
    .btn {
    width: 100%;
    padding: 12px;
    background-color: #4a90e2;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
    transition: background-color 0.3s ease;
    }
    .btn:hover {
        background-color: #357ABD; /* Darker blue on hover */
    }
    .btn:focus {
        outline: none;
    }
    </style>

    {% endblock content %}
